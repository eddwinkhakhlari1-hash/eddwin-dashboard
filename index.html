<!DOCTYPE html>
<html>
<head>
  <title>Eddwin Earnings Dashboard</title>
  <style>
    body {
      font-family: Arial;
      background: #0f172a;
      color: white;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #38bdf8;
    }
    .box {
      background: #020617;
      padding: 20px;
      margin: 15px 0;
      border-radius: 10px;
      font-size: 22px;
    }
    .money {
      color: #22c55e;
      font-size: 28px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h1>💰 Eddwin Earnings Dashboard</h1>

<div class="box">Total Earnings: <span class="money">₹50,000</span></div>
<div class="box">This Month: <span class="money">₹25,000</span></div>
<div class="box">Today: <span class="money">₹25,000</span></div>
<div class="box">Total Views: <span class="money">1,000,000</span></div>

</body>
</html>
